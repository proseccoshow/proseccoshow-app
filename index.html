  .tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none;
    color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--accent); }
  .tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .coon-btn { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); padding: 6px; cursor: pointer; }
  .coon-btn img, .coon-btn svg { width: 100%; height: 100%; object-fit: contain; display: block; }

  .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(11,27,63,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
  .sheet { width: 100%; max-width: 560px; background: var(--bg); border-radius: 28px 28px 0 0; padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px));
    max-height: 92vh; overflow-y: auto; animation: up .28s cubic-bezier(.2,.9,.3,1.2); }
  .sheet-coon { width: 108px; height: 108px; margin: -4px auto 6px; }
  .sheet-coon img, .sheet-coon svg { width: 100%; height: 100%; object-fit: contain; display: block; animation: hop 2.4s ease-in-out infinite; }
  .sheet-name { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .bubble { margin: 10px 0 16px; padding: 14px 16px; border-radius: 18px; background: var(--surface); font-size: 15px; }
  .tip { width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .tip > span:first-child { flex: 1; }
  .tip b { display: block; font-size: 15px; }
  .tip small { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .sheet .dg-go { margin-top: 10px; }
  .sheet-later { display: block; width: 100%; margin-top: 6px; padding: 12px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg, .sheet-coon svg, .sheet-coon img { animation: none; } }

  .tease { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .home-h { font-family: var(--display); font-size: 18px; font-weight: 800; margin: 28px 0 10px; }
  .pair-card { padding: 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; }
  .pair-name { font-family: var(--display); font-size: 22px; font-weight: 900; line-height: 1.2; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .pair-card .btn { background: var(--accent); color: #FFFFFF; margin-top: 14px; }
  .pair-status { font-weight: 700; color: var(--accent); }
  .steps { list-style: none; counter-reset: s; margin: 6px 0 0; }
  .steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .steps li::before { content: counter(s); flex: 0 0 28px; height: 28px; border-radius: 9px; background: var(--accent); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 900; font-size: 14px; }
  .join { width: 100%; border: 0; font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: #FFFFFF; padding: 18px; font-size: 17px; }
  .join[disabled] { opacity: .6; }

  .foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .foot b { display: block; color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
(function () {
  var D = window.KK_DATA;
  var C = D.colors;
  var root = document.documentElement.style;
  root.setProperty("--bg", C.bg); root.setProperty("--surface", C.surface);
  root.setProperty("--accent", C.accent); root.setProperty("--text", C.text); root.setProperty("--muted", C.muted);

  var loc = (location.hash || "") + (location.search || "");
  var inTelegram = loc.indexOf("tgWebApp") !== -1 || !!window.TelegramWebviewProxy ||
    !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction);
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor(C.bg); } catch (e) {}
    try { tg.setBackgroundColor(C.bg); } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var target = inTelegram ? "_self" : "_blank";

  var currentScreen = "home";
  function track(event, extra) {
    var url = D.tracking && D.tracking.webhook;
    if (!url) return;
    var body = { event: event, screen: currentScreen, initData: (tg && tg.initData) || "" };
    if (typeof startParam !== "undefined" && startParam) body.startParam = startParam;
    for (var k in (extra || {})) body[k] = extra[k];
    var json = JSON.stringify(body);
    try {
      fetch(url, { method: "POST", headers: { "Content-Type": "text/plain" }, body: json, keepalive: true, mode: "cors" }).catch(function () {});
    } catch (e) {
      try { navigator.sendBeacon && navigator.sendBeacon(url, json); } catch (e2) {}
    }
  }
  function watchedCount() { var n = 0; for (var k in watched) n++; return n; }
  function link(url, cls, inner) {
    return '<a class="' + cls + '" href="' + esc(url) + '" data-url="' + esc(url) + '" target="' + target + '" rel="noopener">' + inner + "</a>";
  }

  var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var MON_SHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  function parseDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function upcoming() {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return D.events.filter(function (e) { return parseDate(e.date) >= t; })
      .sort(function (a, b) { return parseDate(a.date) - parseDate(b.date); });
  }

  var app = document.getElementById("app");
  var activeTopic = null;

  function arrowCard(m) {
    return link(m.url, "card", '<span class="card-body"><span class="card-title">' + esc(m.title) + '</span><span class="card-cap">' +
      esc(m.caption) + '</span></span><span class="arrow" aria-hidden="true">›</span>');
  }

  function renderHome() {
    var h = '<header><div class="head-row"><div>';
    if (D.header.label) h += '<p class="label">' + esc(D.header.label) + "</p>";
    h += '<h1 class="title"><span>' + esc(D.header.titleLine1) + "</span>" + (D.header.titleLine2 ? "<span>" + esc(D.header.titleLine2) + "</span>" : "") + "</h1></div>";
    if (D.mascot) h += '<button class="coon-btn" data-coon aria-label="' + esc(D.mascot.name) + '">' + coonImg() + "</button>";
    h += '</div><p class="desc">' + esc(D.header.description) + "</p></header>";

    var f = D.featured;
    if (f) {
      h += '<section class="next"><p class="next-kicker">' + esc(f.kicker) + "</p>";
      h += '<p class="next-date">' + esc(f.title) + "</p>";
      h += '<p class="next-place">' + esc(f.text) + "</p>";
      h += (f.go === "course" ? '<button class="btn" style="width:100%;border:0;font:inherit;font-weight:700;cursor:pointer" data-course="1">' + esc(f.button) + "</button>" : link(f.url, "btn", esc(f.button))) + "</section>";
    }
    var next = f ? null : upcoming()[0];
    if (next) {
      var d = parseDate(next.date);
      h += '<section class="next"><p class="next-kicker">Ближайшее событие</p>';
      h += '<p class="next-date">' + d.getDate() + " " + MONTHS[d.getMonth()] + (next.time ? ", " + esc(next.time) : "") + "</p>";
      h += '<p class="next-title">' + esc(next.title) + "</p>";
      if (next.guest) h += '<p class="next-place" style="margin-bottom:2px">' + esc(next.guestLabel || "Гость") + ": " + esc(next.guest) + "</p>";
      h += '<p class="next-place">' + esc(next.place) + "</p>";
      h += link(next.url, "btn", esc(next.button)) + "</section>";
    }

    // Ближайшее: следующая практика + пара недели
    var np = practiceItems()[0];
    if (np || D.pairs) h += '<h2 class="home-h">На этой неделе</h2><div class="list">';
    if (np) {
      h += '<button class="sec" data-go="artlab"><span class="ev-date"><span class="ev-day">' + np.d.getDate() + '</span><span class="ev-mon">' + MON_SHORT[np.d.getMonth()] +
        '</span></span><span class="sec-body"><span class="card-title">' + esc(np.title) + '</span><span class="sec-cap">' + esc(np.cap.split("\n")[0]) +
        '</span></span><span class="arrow" aria-hidden="true">›</span></button>';
    }
    if (D.pairs) {
      var today = new Date().getDay() === D.pairs.joinDay;
      h += '<button class="sec" data-go="pairs"><span class="sec-body"><span class="card-title">' + esc(D.sections.pairs.title) + '</span><span class="sec-cap">' +
        esc(today ? "Сегодня запись — нажмите «" + D.pairs.button + "»" : D.sections.pairs.caption) + '</span></span><span class="arrow" aria-hidden="true">›</span></button>';
    }
    if (np || D.pairs) h += "</div>";
    var G = D.diag;
    if (G) {
      h += '<section class="next"><p class="next-kicker">' + esc(G.tag) + "</p>";
      h += '<p class="next-date">' + esc(G.title) + "</p>";
      h += '<p class="next-place">' + esc(G.short) + "</p>";
      h += '<button class="btn" style="width:100%;border:0;font:inherit;font-weight:700;cursor:pointer" data-go="diag">' + esc(G.more) + "</button></section>";
    }
    var K = D.consult;
    if (K) {
      h += '<section class="consult"><h2>' + esc(K.title) + "</h2><p>" + esc(K.text) + "</p>";
      h += link(K.url, "btn", esc(K.button));
      if (K.phone) h += '<a class="consult-phone" href="tel:' + esc(K.phone) + '">' + esc(K.phoneLabel) + "</a>";
      h += "</section>";
    }
    h += '<footer class="foot"><b>' + esc(D.footer.name) + "</b>" + esc(D.footer.school) + "</footer>";
    return h;
  }

  function screenHead(key) {
    return '<h1 class="screen-title">' + esc(D.sections[key].title) + "</h1>";
  }

  function renderEvents() {
    var list = upcoming();
    var h = screenHead("events");
    if (!list.length) return h + '<p class="empty">Новые события скоро появятся — следите за чатом.</p>';
    h += '<div class="list">';
    list.forEach(function (e) {
      var d = parseDate(e.date);
      var inner =         '<span class="ev-date"><span class="ev-day">' + d.getDate() + '</span><span class="ev-mon">' + MON_SHORT[d.getMonth()] + "</span></span>" +
        '<span class="card-body"><span class="card-title">' + esc(e.title) + '</span><span class="card-cap">' +
        (e.time ? esc(e.time) + ", " : "") + esc(e.place) + (e.guest ? "<br>" + esc(e.guestLabel || "Гость") + ": " + esc(e.guest) : "") + "</span>" + (e.url ? "" : '<span class="ev-soon">Скоро добавим ссылку</span>') + "</span>" +
        (e.url ? '<span class="ev-btn">' + esc(e.button) + "</span>" : "");
      h += e.url ? link(e.url, "card", inner) : '<div class="card">' + inner + "</div>";
    });
    return h + "</div>";
  }

  var WATCH_KEY = "prscc_course_watched";
  var watched = {};
  function loadWatched(cb) {
    try { watched = JSON.parse(localStorage.getItem(WATCH_KEY) || "{}") || {}; } catch (e) { watched = {}; }
    try {
      if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
        tg.CloudStorage.getItem(WATCH_KEY, function (err, val) {
          if (!err && val) { try { var w = JSON.parse(val); for (var k in w) watched[k] = w[k]; } catch (e) {} }
          cb();
        });
        return;
      }
    } catch (e) {}
    cb();
  }
  function saveWatched() {
    var s = JSON.stringify(watched);
    try { localStorage.setItem(WATCH_KEY, s); } catch (e) {}
    try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) tg.CloudStorage.setItem(WATCH_KEY, s); } catch (e) {}
  }

  function renderCourse() {
    var K = D.course, total = K.lessons.length, done = 0;
    K.lessons.forEach(function (l) { if (watched[l.url]) done++; });
    var h = '<section class="course"><p class="course-kicker">' + esc(K.kicker) + " · " + total + " уроков</p>";
    h += '<p class="course-title">' + esc(K.title) + "</p>";
    h += '<p class="course-text">' + esc(K.text) + "</p>";
    h += '<div class="bar"><i style="width:' + Math.round(done / total * 100) + '%"></i></div>';
    h += '<p class="course-prog">' + (done === total ? "Курс пройден" : "Просмотрено " + done + " из " + total) + "</p></section>";
    h += '<div class="lessons">';
    K.lessons.forEach(function (l) {
      var isDone = !!watched[l.url];
      h += '<a class="lesson' + (isDone ? " done" : "") + '" href="' + esc(l.url) + '" data-url="' + esc(l.url) + '" data-lesson="' + esc(l.url) + '" target="' + target + '" rel="noopener">' +
        '<span class="lesson-num">' + (isDone ? "✓" : esc(l.n)) + "</span>" +
        '<span class="card-body"><span class="card-title">' + esc(l.title) + '</span><span class="lesson-text">' + esc(l.text) + "</span>" +
        '<span class="lesson-btn">' + (isDone ? "Пересмотреть" : "Смотреть") + "</span></span></a>";
    });
    return h + "</div>";
  }

  function renderMaterials() {
    var h = screenHead("materials");
    h += '<div class="chips"><button class="chip' + (activeTopic === null ? " on" : "") + '" data-topic="">Все</button>';
    D.topics.forEach(function (t) {
      h += '<button class="chip' + (activeTopic === t ? " on" : "") + '" data-topic="' + esc(t) + '">' + esc(t) + "</button>";
    });
    h += "</div>";
    var showCourse = D.course && (activeTopic === null || activeTopic === D.course.topic);
    if (showCourse) h += renderCourse();
    var rest = D.materials.filter(function (m) { return activeTopic === null || m.topic === activeTopic; });
    if (rest.length) {
      if (showCourse) h += '<h2 class="group-title">Ещё материалы</h2>';
      h += '<div class="list">';
      rest.forEach(function (m) { h += arrowCard(m); });
      h += "</div>";
    }
    return h;
  }

  var WEEKDAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  function artlabDates() {
    var A = D.artlab, out = [], d = new Date(); d.setHours(0, 0, 0, 0);
    while (d.getDay() !== A.weekday) d.setDate(d.getDate() + 1);
    for (var i = 0; i < A.weeksAhead; i++) { out.push(new Date(d)); d.setDate(d.getDate() + 7); }
    return out;
  }

  function practiceItems() {
    var A = D.artlab, t0 = new Date(); t0.setHours(0, 0, 0, 0);
    var items = artlabDates().map(function (d) {
      return { d: d, title: "Арт Лаб", cap: WEEKDAYS[d.getDay()] + ", " + A.time, button: A.button, url: A.ticketUrl };
    });
    (A.extra || []).forEach(function (x) {
      var d = parseDate(x.date);
      if (d < t0) return;
      items.push({ d: d, title: x.title, cap: WEEKDAYS[d.getDay()] + ", " + x.time + (x.guest ? "\n" + (x.guestLabel || "Гость") + ": " + x.guest : ""), button: x.button, url: x.url });
    });
    return items.sort(function (a, b) { return a.d - b.d; });
  }

  // ---------- Пара недели ----------
  var pairState = null, pairLoading = false, pairErr = "";
  function pairCall(action, cb) {
    var P = D.pairs;
    if (!P.webhook || !(tg && tg.initData)) { pairErr = "tg"; cb(); return; }
    fetch(P.webhook, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: action, initData: tg.initData }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) { pairState = j; pairErr = ""; } else pairErr = "srv"; cb(); })
      .catch(function () { pairErr = "net"; cb(); });
  }
  function daysTo(wd) { var n = (wd - new Date().getDay() + 7) % 7; return n; }
  function contactUrl(u) { return u.username ? "https://t.me/" + u.username : ""; }
  function renderPairs() {
    var P = D.pairs, S = pairState;
    var h = '<h1 class="screen-title">' + esc(D.sections.pairs.title) + "</h1>";
    if (pairLoading && !S) return h + '<p class="empty">Загружаем…</p>';
    if (pairErr === "tg") h += '<div class="pair-card">Откройте приложение в Telegram, чтобы участвовать.</div>';
    else if (pairErr && !S) h += '<div class="pair-card">Не получилось связаться с сервером. Попробуйте позже.</div>';

    if (S && S.pair) {
      h += '<div class="pair-card"><p class="card-cap">Ваша пара на эту неделю</p>';
      if (!S.pair.length) h += '<p class="pair-name">В этот раз пары не нашлось</p><p class="card-cap">Записался только один человек. Попробуйте в следующее воскресенье!</p>';
      S.pair.forEach(function (u) {
        h += '<p class="pair-name">' + esc(u.name || "Участник чата") + "</p>";
        var cu = contactUrl(u);
        h += cu ? link(cu, "btn", "Написать @" + esc(u.username)) : '<p class="card-cap">Контакт — в сообщении от бота.</p>';
      });
      h += "</div>";
    }
    var isDay = new Date().getDay() === P.joinDay;
    if (S && S.joined) {
      h += '<div class="pair-card"><p class="pair-status">✓ Вы в деле!</p><p class="card-cap">В понедельник утром бот пришлёт вашу пару в личные сообщения.</p></div>';
    } else if (isDay && !pairErr) {
      h += '<button class="btn join" data-pair-join' + (pairLoading ? " disabled" : "") + ">" + esc(pairLoading ? "Записываем…" : P.button) + "</button>";
      h += '<p class="dg-note">Запись открыта до конца воскресенья</p>';
    } else if (!pairErr) {
      var n = daysTo(P.joinDay);
      h += '<div class="pair-card"><p class="pair-status">Запись — в воскресенье</p><p class="card-cap">' + (n === 1 ? "Уже завтра" : "Через " + n + " " + plural(n, "день", "дня", "дней")) + ". Возвращайтесь — будет кнопка «" + esc(P.button) + "».</p></div>";
    }
    h += '<p class="intro" style="margin-top:22px">' + esc(P.text) + '</p><ol class="steps">';
    P.steps.forEach(function (s) { h += "<li><span>" + esc(s) + "</span></li>"; });
    return h + "</ol>";
  }
  function plural(n, a, b, c) { var m = n % 10, mm = n % 100; return m === 1 && mm !== 11 ? a : (m >= 2 && m <= 4 && (mm < 10 || mm >= 20) ? b : c); }

  // ---------- Енот Илья ----------
  var COON_SVG = '<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="#8C95A8"><path d="M22 40 L30 10 L52 30 Z"/><path d="M98 40 L90 10 L68 30 Z"/></g>' +
    '<g fill="#3A4256"><path d="M29 34 L33 19 L44 30 Z"/><path d="M91 34 L87 19 L76 30 Z"/></g>' +
    '<ellipse cx="60" cy="66" rx="46" ry="40" fill="#A7B0C2"/>' +
    '<path d="M60 36 C52 36 50 46 60 54 C70 46 68 36 60 36 Z" fill="#F4F6FA"/>' +
    '<path d="M16 62 C26 46 46 50 56 64 C46 78 26 78 16 62 Z M104 62 C94 46 74 50 64 64 C74 78 94 78 104 62 Z" fill="#2B3245"/>' +
    '<circle cx="40" cy="63" r="8" fill="#FFFFFF"/><circle cx="80" cy="63" r="8" fill="#FFFFFF"/>' +
    '<circle cx="41" cy="64" r="4.6" fill="#0B1B3F"/><circle cx="81" cy="64" r="4.6" fill="#0B1B3F"/>' +
    '<circle cx="43" cy="62" r="1.6" fill="#FFFFFF"/><circle cx="83" cy="62" r="1.6" fill="#FFFFFF"/>' +
    '<ellipse cx="60" cy="86" rx="22" ry="16" fill="#F4F6FA"/>' +
    '<ellipse cx="60" cy="79" rx="6.5" ry="4.5" fill="#0B1B3F"/>' +
    '<path d="M52 89 Q60 96 68 89" stroke="#0B1B3F" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
    '<circle cx="30" cy="80" r="5" fill="#1F5BFF" opacity=".18"/><circle cx="90" cy="80" r="5" fill="#1F5BFF" opacity=".18"/></svg>';
  function coonImg() { return D.mascot && D.mascot.image ? '<img src="' + esc(D.mascot.image) + '" alt="">' : COON_SVG; }
  var COON_KEY = "prscc_coon_seen";
  function coonSuggestion() {
    var K = D.course;
    if (D.pairs && new Date().getDay() === D.pairs.joinDay && !(pairState && pairState.joined)) return { go: "pairs", text: "Сегодня воскресенье — запишитесь в пару недели!", button: "Хочу пару" };
    if (K) {
      var next = null; K.lessons.forEach(function (l) { if (!next && !watched[l.url]) next = l; });
      if (next && watchedCount() === 0) return { go: "course", text: "Начните с вводного урока — поймёте, как импровизация работает в жизни.", button: "Смотреть вводный урок" };
      if (next) return { go: "course", text: "Вы уже начали курс! Дальше — " + next.title + ".", button: "Продолжить курс" };
    }
    return { go: "artlab", text: "Курс пройден — время практики! Арт Лаб каждый понедельник, промокод уже ждёт.", button: "К практикам" };
  }
  function openCoon(auto) {
    var M = D.mascot, sg = coonSuggestion();
    var h = '<div class="sheet" role="dialog" aria-label="' + esc(M.name) + '"><div class="sheet-coon">' + coonImg() + '</div><p class="sheet-name">' + esc(M.name) + "</p>";
    h += '<div class="bubble">' + esc(auto ? M.hello : "Снова привет! Вот что я бы сделал сейчас:") + "</div>";
    if (auto) M.tips.forEach(function (t) { h += '<button class="tip" data-coon-go="' + esc(t.go) + '"><span><b>' + esc(t.title) + "</b><small>" + esc(t.text) + '</small></span><span class="arrow" aria-hidden="true">›</span></button>'; });
    else h += '<div class="bubble" style="margin-top:0">' + esc(sg.text) + "</div>";
    h += '<button class="btn dg-go" data-coon-go="' + esc(sg.go) + '">' + esc(sg.button) + '</button><button class="sheet-later" data-coon-close>' + esc(M.later) + "</button></div>";
    var bg = document.createElement("div"); bg.className = "sheet-bg"; bg.innerHTML = h;
    document.body.appendChild(bg);
    track("mascot_open", { target: auto ? "auto" : "button" });
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); }
    bg.addEventListener("click", function (e) { if (e.target === bg) { close(); track("mascot_close"); } });
    bg.querySelector("[data-coon-close]").addEventListener("click", function () { close(); track("mascot_close"); });
    var gs = bg.querySelectorAll("[data-coon-go]");
    for (var i = 0; i < gs.length; i++) gs[i].addEventListener("click", function () {
      var g = this.getAttribute("data-coon-go"); close(); track("mascot_action", { target: g });
      if (g === "course") { activeTopic = D.course.topic; show("materials"); } else show(g);
    });
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); } catch (e) {}
  }
  function coonSeenCheck(cb) {
    var seen = false;
    try { seen = !!localStorage.getItem(COON_KEY); } catch (e) {}
    if (seen) return cb(true);
    try {
      if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
        tg.CloudStorage.getItem(COON_KEY, function (err, v) { cb(!err && !!v); });
        return;
      }
    } catch (e) {}
    cb(false);
  }
  function coonMarkSeen() {
    try { localStorage.setItem(COON_KEY, "1"); } catch (e) {}
    try { if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) tg.CloudStorage.setItem(COON_KEY, "1"); } catch (e) {}
  }

  function renderArtlab() {
    var A = D.artlab;
    var h = screenHead("artlab") + '<p class="intro">' + esc(A.intro) + "</p>";
    if (A.promo) {
      h += '<section class="promo"><p class="promo-text">' + esc(A.promo.text) + "</p>";
      h += '<button class="promo-code" data-copy="' + esc(A.promo.code) + '"><b>' + esc(A.promo.code) +
        '</b><span class="promo-hint">Скопировать</span></button></section>';
    }
    var items = practiceItems();
    h += '<div class="list">';
    items.forEach(function (it) {
      var inner = '<span class="ev-date"><span class="ev-day">' + it.d.getDate() + '</span><span class="ev-mon">' + MON_SHORT[it.d.getMonth()] + "</span></span>" +
        '<span class="card-body"><span class="card-title">' + esc(it.title) + '</span><span class="card-cap">' + esc(it.cap).replace("\n", "<br>") + "</span></span>" +
        (it.button ? '<span class="ev-btn">' + esc(it.button) + "</span>" : "");
      h += it.url ? link(it.url, "card", inner) : '<div class="card">' + inner + "</div>";
    });
    return h + "</div>";
  }

  var diagFor = "team";
  function renderDiag() {
    var G = D.diag, m = diagFor;
    var h = '<button class="back" data-go="home">‹ Назад</button><p class="dg-tag">' + esc(G.tag) + '</p><h1 class="screen-title">' + esc(G.title) + "</h1>";
    h += '<p class="intro">' + esc(G.text) + "</p>";
    h += '<div class="chips"><button class="chip' + (m === "team" ? " on" : "") + '" data-diag="team">С командой</button><button class="chip' + (m === "self" ? " on" : "") + '" data-diag="self">Самостоятельно</button></div>';
    h += '<div class="card" style="margin-bottom:26px"><span class="card-body">' + esc(G[m]) + "</span></div>";
    h += '<h2 class="dg-h">' + esc(G.resultsTitle) + '</h2><p class="intro">' + esc(G.resultsLead) + '</p><div class="list">';
    G.results.forEach(function (r, i) {
      h += '<div class="card dg-item"><span class="dg-n">' + (i + 1) + '</span><span class="card-body"><span class="card-title">' + esc(r.t) + '</span><span class="card-cap">' + esc(r.d) + "</span></span></div>";
    });
    h += '</div><button class="btn dg-go" data-diag-go>' + esc(G.button) + '</button><p class="dg-note">' + esc(G.tag) + "</p>";
    return h;
  }
  function diagUrl() {
    var G = D.diag, msg = G.message && G.message[diagFor], u = G.url;
    if (msg && u.indexOf("https://t.me/") === 0) u += (u.indexOf("?") === -1 ? "?" : "&") + "text=" + encodeURIComponent(msg);
    return u;
  }

  function copyText(text, done) {
    function fallback() {
      var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", "");
      t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t); done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  var TAB_KEYS = ["home", "events", "materials", "artlab"];
  if (D.pairs) TAB_KEYS.push("pairs");
  var ICONS = {
    home: '<path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',
    events: '<rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3.5v4M15 3.5v4"/>',
    materials: '<path d="M5 4.5h5.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-4.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z"/>',
    artlab: '<path d="M12 3.5 14.4 9l5.6.5-4.3 3.7 1.3 5.6L12 15.9l-5 2.9 1.3-5.6L4 9.5 9.6 9z"/>',
    pairs: '<circle cx="8.5" cy="8.5" r="3.2"/><circle cx="16" cy="9.5" r="2.7"/><path d="M3 19.5c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5M14 14.6c.6-.2 1.3-.3 2-.3 2.4 0 4.3 1.5 5 5.2"/>'
  };
  var tabsEl = document.createElement("nav");
  tabsEl.className = "tabs"; tabsEl.setAttribute("aria-label", "Разделы");
  var th = '<div class="tabs-in">';
  TAB_KEYS.forEach(function (k) {
    th += '<button class="tab" data-tab="' + k + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' +
      ICONS[k] + "</svg><span>" + esc(D.sections[k].tab || D.sections[k].title) + "</span></button>";
  });
  tabsEl.innerHTML = th + "</div>";
  document.body.appendChild(tabsEl);
  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-tab]") : null;
    if (!b) return;
    var k = b.getAttribute("data-tab");
    if (k === "materials" && currentScreen !== "materials") activeTopic = null;
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e2) {}
    show(k); track("tab", { target: k });
  });

  function show(screen) {
    var map = { home: renderHome, events: renderEvents, materials: renderMaterials, artlab: renderArtlab };
    if (D.diag) map.diag = renderDiag;
    if (D.pairs) map.pairs = renderPairs;
    var prev = currentScreen;
    currentScreen = map[screen] ? screen : "home";
    app.innerHTML = map[currentScreen]();
    if (prev !== currentScreen) window.scrollTo(0, 0);
    bind();
    var tb = tabsEl.querySelectorAll("[data-tab]");
    for (var i = 0; i < tb.length; i++) {
      var on = tb[i].getAttribute("data-tab") === (currentScreen === "diag" ? "home" : currentScreen);
      tb[i].className = "tab" + (on ? " on" : "");
      if (on) tb[i].setAttribute("aria-current", "page"); else tb[i].removeAttribute("aria-current");
    }
    if (tg && tg.BackButton) {
      try { if (currentScreen === "diag") tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
    }
    if (currentScreen === "pairs" && !pairLoading && prev !== "pairs") {
      pairLoading = true;
      pairCall("status", function () { pairLoading = false; if (currentScreen === "pairs") show("pairs"); });
      if (!pairState) app.innerHTML = renderPairs();
    }
  }
  if (tg && tg.BackButton) { try { tg.BackButton.onClick(function () { show("home"); track("screen_view", { target: "home" }); }); } catch (e) {} }

  function postEvent(type, data) {
    var payload = data || {};
    try {
      if (window.TelegramWebviewProxy) {
        window.TelegramWebviewProxy.postEvent(type, JSON.stringify(payload));
      } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) {
        window.webkit.messageHandlers.performAction.postMessage(JSON.stringify({ eventType: type, eventData: payload }));
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: type, eventData: payload }), "*");
      }
    } catch (e) {}
  }

  function onLink(e) {
    var url = this.getAttribute("data-url");
    var ttl = this.querySelector(".card-title") ? this.querySelector(".card-title").textContent : this.textContent;
    if (!this.hasAttribute("data-lesson")) track("link_click", { target: url, title: ttl.trim().slice(0, 120) });
    if (!url || !inTelegram) return;
    e.preventDefault();
    openExternal(url);
  }
  function openExternal(url) {
    if (!inTelegram) { window.open(url, "_blank", "noopener"); return; }
    var isTg = url.indexOf("https://t.me/") === 0;
    if (tg) {
      if (isTg) { tg.close(); tg.openTelegramLink(url); }
      else { tg.openLink(url); }
    } else {
      if (isTg) {
        postEvent("web_app_close");
        postEvent("web_app_open_tg_link", { path_full: url.replace("https://t.me", "") });
      } else {
        postEvent("web_app_open_link", { url: url });
      }
    }
  }

  function bind() {
    var i, els;
    els = app.querySelectorAll("[data-copy]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () {
      var btn = this, hint = btn.querySelector(".promo-hint");
      track("promo_copy", { target: btn.getAttribute("data-copy") });
      copyText(btn.getAttribute("data-copy"), function () {
        hint.textContent = "Скопировано";
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
        setTimeout(function () { hint.textContent = "Скопировать"; }, 1800);
      });
    });
    els = app.querySelectorAll("[data-course]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () { track("course_banner"); activeTopic = D.course.topic; show("materials"); track("screen_view", { target: "materials:" + D.course.topic }); });
    els = app.querySelectorAll("[data-lesson]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () {
      var u = this.getAttribute("data-lesson");
      var first = !watched[u];
      if (first) watched[u] = Date.now();
      track("lesson_open", { target: u, title: this.querySelector(".card-title").textContent, repeat: !first, lessons: watchedCount() });
      if (first) {
        saveWatched();
        var self = this;
        setTimeout(function () { if (document.body.contains(self)) { var y = window.scrollY; show("materials"); window.scrollTo(0, y); } }, 400);
      }
    });
    els = app.querySelectorAll("a[data-url]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", onLink);
    els = app.querySelectorAll("[data-go]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () { var g = this.getAttribute("data-go"); show(g); track("screen_view", { target: g }); });
    els = app.querySelectorAll("[data-diag]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () { diagFor = this.getAttribute("data-diag"); track("diag_mode", { target: diagFor }); var y = window.scrollY; show("diag"); window.scrollTo(0, y); });
    els = app.querySelectorAll("[data-diag-go]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function (e) {
      track("diag_signup", { target: diagFor });
      try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium"); } catch (e2) {}
      openExternal(diagUrl());
    });
    els = app.querySelectorAll("[data-coon]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () { openCoon(false); });
    els = app.querySelectorAll("[data-pair-join]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () {
      if (pairLoading) return;
      pairLoading = true; show("pairs"); track("pair_join");
      pairCall("join", function () {
        pairLoading = false;
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(pairErr ? "error" : "success"); } catch (e) {}
        show("pairs");
      });
    });
    els = app.querySelectorAll("[data-topic]");
    for (i = 0; i < els.length; i++) els[i].addEventListener("click", function () {
      var t = this.getAttribute("data-topic"); activeTopic = t || null; show("materials"); track("topic", { target: t || "Все" });
    });
  }

  var startParam = "";
  try { startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || ""; } catch (e) {}
  if (!startParam) { var m = /[?&#]tgWebAppStartParam=([^&]+)/.exec(loc); if (m) startParam = decodeURIComponent(m[1]); }
  loadWatched(function () {
    track("app_open", { lessons: watchedCount(), platform: (tg && tg.platform) || "web" });
    if (startParam === "course" && D.course) { activeTopic = D.course.topic; show("materials"); }
    else if (startParam.split("__")[0] === "diag" && D.diag) show("diag");
    else if (startParam === "pairs" && D.pairs) show("pairs");
    else if (TAB_KEYS.indexOf(startParam) > 0) show(startParam);
    else show("home");
    if (D.mascot) coonSeenCheck(function (seen) {
      if (seen) return;
      coonMarkSeen();
      setTimeout(function () { openCoon(true); }, 600);
    });
  });
})();
</script>
</body>
</html>
